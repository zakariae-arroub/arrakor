<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARRAKOR – La mascotte</title>
<meta name="description" content="La mascotte de l’équipe ARRAKOR : un robot doré qui se présente, danse, fait des pirouettes et lève le pouce.">
<meta name="theme-color" content="#0d0b08">
<link rel="icon" type="image/png" href="image.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&family=Michroma&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   Plan : une seule scène plein cadre, thème sombre ambré assumé (pas de thème clair).
   Mise en page : mascotte SVG centrée au-dessus d'une barre d'actions,
   un canvas de poussière derrière, un canvas de particules devant.
   Pendant la présentation de l'équipage, le robot se range et une fiche s'affiche.
   ========================================================================== */
:root{
  --night:#0d0b08;        /* Nuit : fond du site */
  --ember:#8a4409;        /* cœur chaud du décor */
  --amber:#ff9a1f;        /* Ambre : halo, état actif */
  --gold:#f2b641;         /* Or de la charte */
  --gold-light:#fde9b4;   /* reflets et texte */
  --ink:#2b1a0c;          /* texte sur fond clair */
  --font-ui:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-display:"Michroma","Eurostile",system-ui,sans-serif;
  --team-img:url("equipe.jpg?v=1");   /* planche des cinq avatars, côte à côte */
  --dock:140px;           /* hauteur réservée à la barre d'actions, recalculée en JS */
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--night);
  color:var(--gold-light);
  font-family:var(--font-ui);
  overflow:hidden;
}

.stage{
  position:relative;
  height:100%;
  min-height:360px;
  overflow:hidden;
  background:radial-gradient(120% 90% at 50% 38%, var(--ember) 0%, #5a2b07 26%, #2a1305 58%, var(--night) 100%);
  touch-action:manipulation;
}
.stage::after{            /* vignette douce */
  content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
  background:radial-gradient(115% 100% at 50% 42%, transparent 52%, rgba(0,0,0,.5) 100%);
}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#dust{z-index:0}
#embers{z-index:2}

.sr-only{
  position:absolute;width:1px;height:1px;margin:-1px;padding:0;
  overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0;
}

/* ---------- Mascotte ---------- */
#mascot{
  position:absolute;left:0;top:0;z-index:1;
  width:100%;height:calc(100% - var(--dock));
  display:block;overflow:visible;
}
#robot{cursor:pointer;touch-action:none}

.pA{fill:url(#gA);stroke:url(#gA)}
.pB{fill:url(#gB);stroke:url(#gB)}
.pC{fill:url(#gC);stroke:url(#gC)}
.pD{fill:url(#dk);stroke:url(#dk)}
.pH{fill:url(#hand);stroke:url(#hand)}
.r{stroke-width:5;stroke-linejoin:round}
.slit{stroke:#0e0805;stroke-width:5;stroke-linecap:round;fill:none}
.seam{stroke:#6f4512;stroke-opacity:.38;stroke-width:1.5;stroke-linecap:round;fill:none}
.groove{stroke:#1c120b;stroke-opacity:.55;stroke-width:2.5;stroke-linecap:round;fill:none}
.e-arc,.e-heart,.e-round{fill:url(#eyeGrad);stroke:#ffd75a;stroke-width:2.5;stroke-linejoin:round}

.comet{transform-origin:400px 312px;animation:spin 9s linear infinite}
.comet.rev{animation-duration:15s;animation-direction:reverse}
.orbit{transform-origin:400px 312px;animation:spin 22s linear infinite}
.orbit.slow{animation-duration:34s;animation-direction:reverse}
.flash{transform-origin:400px 312px;opacity:0}
.flashing .flash{animation:flash .8s ease-out 1}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flash{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(1.3)}}
.paused *,.paused *::before{animation-play-state:paused !important}

/* ---------- Bulle ---------- */
.bubble{
  position:absolute;z-index:3;left:0;top:0;
  max-width:300px;
  padding:.7em 1em;
  font:500 1rem/1.36 var(--font-ui);
  color:var(--ink);
  background:linear-gradient(165deg,#fff8e4,#fbdf9f);
  border-radius:20px;
  box-shadow:0 10px 30px rgba(0,0,0,.35),0 0 26px rgba(255,154,31,.35);
  opacity:0;
  transform:translateY(10px) scale(.9);
  transition:opacity .28s ease,transform .38s cubic-bezier(.3,1.5,.5,1);
  pointer-events:none;
}
.bubble.show{opacity:1;transform:none}
.bubble::after{
  content:"";position:absolute;width:18px;height:18px;
  background:#fbdf9f;border-radius:4px;transform:rotate(45deg);
}
.bubble.side{transform-origin:0 100%}
.bubble.side::after{left:-7px;bottom:16px}
.bubble.top{transform-origin:50% 100%}
.bubble.top::after{left:calc(50% - 9px);bottom:-7px}
.bubble .off{visibility:hidden}

/* ---------- Présentation de l'équipage ---------- */
.deck{
  position:absolute;z-index:2;top:0;bottom:var(--dock);right:max(16px,4%);
  width:min(450px,44%);
  display:flex;align-items:center;
  opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .35s ease,visibility 0s .35s;
}
.is-deck .deck{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .35s ease}
.deck__card{
  width:100%;
  padding:20px 24px 16px;
  background:linear-gradient(160deg,rgba(46,27,13,.88),rgba(18,11,6,.92));
  border:1px solid rgba(253,233,180,.3);
  border-radius:22px;
  box-shadow:0 18px 50px rgba(0,0,0,.45),0 0 40px rgba(255,154,31,.18);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
}
.is-deck .deck__card{animation:cardIn .65s cubic-bezier(.2,.8,.2,1) both}
.deck__card.flip{animation:cardFlip .55s cubic-bezier(.2,.8,.2,1) both}
.deck__bar{display:flex;gap:6px;margin-bottom:18px}
.deck__bar.is-long{gap:3px}
.deck__bar i{flex:1;height:3px;border-radius:3px;background:rgba(253,233,180,.2);overflow:hidden}
.deck__bar i::after{content:"";display:block;height:100%;width:calc(var(--p,0) * 100%);border-radius:3px;background:var(--amber)}
.deck__slide{display:grid;grid-template-columns:auto 1fr;gap:14px 20px;align-items:center;align-content:center;min-height:176px}
.deck__crew{grid-column:1 / -1;display:flex;gap:10px}
.deck__slide:not(.is-group) .deck__crew,.deck__slide:not(.is-person) .ava--big,.deck [hidden]{display:none}
.deck__slide:not(.is-person) .deck__id{grid-column:1 / -1}
.ava{
  position:relative;flex:none;width:58px;aspect-ratio:1;border-radius:50%;
  background:#2a140c var(--team-img) calc(var(--k) * 25%) 0 / 500% auto no-repeat;
  box-shadow:0 0 0 2px rgba(242,182,65,.85),0 0 0 6px rgba(242,182,65,.16),0 0 22px rgba(255,154,31,.45);
}
.ava--big{width:128px}
.ava--big::before{                         /* une lueur tourne autour du portrait, comme sur le halo */
  content:"";position:absolute;inset:-10px;border-radius:50%;
  background:conic-gradient(from 0deg,transparent 0 68%,var(--amber) 86%,#fff3cf 94%,transparent 100%);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 3px));
  mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 3px));
  animation:spin 3.2s linear infinite;
}
.deck__tag{margin:0;font:600 .72rem/1.2 var(--font-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--amber)}
.deck__name{margin:8px 0 0;font:400 1.02rem/1.3 var(--font-display);letter-spacing:.02em;text-transform:uppercase;color:var(--gold);text-wrap:balance}
.deck__role{margin:8px 0 0;font:600 1rem/1.3 var(--font-ui);color:var(--gold-light)}
.deck__txt{grid-column:1 / -1;margin:0;font:500 .95rem/1.45 var(--font-ui);color:rgba(253,233,180,.8)}
.is-person .deck__txt{min-height:2.9em}
.deck__stats{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:10px}
.stat{flex:1 1 96px;padding:12px 14px;border:1px solid rgba(253,233,180,.22);border-radius:14px;background:rgba(253,233,180,.06)}
.stat b{display:block;font:400 1.02rem/1.25 var(--font-display);letter-spacing:.02em;text-transform:uppercase;color:var(--gold)}
.stat span{display:block;margin-top:4px;font:500 .8rem/1.3 var(--font-ui);color:rgba(253,233,180,.74)}
.deck__list{grid-column:1 / -1;display:grid;gap:9px;margin:0;padding:0;list-style:none;font:500 .93rem/1.4 var(--font-ui);color:rgba(253,233,180,.86)}
.deck__list li{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start}
.deck__list b{display:grid;place-items:center;width:22px;height:22px;margin-top:-1px;border-radius:50%;font:600 .74rem/1 var(--font-ui);color:var(--ink);background:var(--amber)}
.deck__list b:empty{width:8px;height:8px;margin:7px 7px 0}
.deck__list strong{font-weight:600;color:#fff3cf}
.deck__list.is-tags{display:flex;flex-wrap:wrap;gap:7px}
.deck__list.is-tags li{display:block;padding:.42em .85em;border:1px solid rgba(253,233,180,.26);border-radius:999px;background:rgba(253,233,180,.06)}
.deck__list.is-tags b{display:none}
.deck__nav{display:flex;align-items:center;gap:8px;margin-top:12px}
.deck__btn{
  display:grid;place-items:center;width:34px;height:34px;padding:0;
  font:600 1.15rem/1 var(--font-ui);color:var(--gold-light);
  background:rgba(253,233,180,.08);border:1px solid rgba(253,233,180,.3);border-radius:50%;
  cursor:pointer;transition:background-color .2s,border-color .2s,transform .2s;
}
.deck__btn:hover{background:rgba(253,233,180,.18);border-color:rgba(253,233,180,.7)}
.deck__btn:active{transform:scale(.92)}
.deck__btn:focus-visible{outline:2px solid #ffd23a;outline-offset:3px}
.deck__btn--text{width:auto;margin-left:auto;padding:0 14px;font-size:.84rem;border-radius:999px}
.deck__count{min-width:3.2em;text-align:center;font:500 .84rem/1 var(--font-ui);font-variant-numeric:tabular-nums;color:rgba(253,233,180,.74)}

/* Chaque fiche arrive par morceaux : portrait, pôle, nom, rôle, texte */
.deck__slide.go .ava--big{animation:avaIn .7s cubic-bezier(.3,1.5,.5,1) both}
.deck__slide.go .deck__crew .ava{animation:avaIn .6s cubic-bezier(.3,1.5,.5,1) both;animation-delay:calc(var(--k) * 90ms)}
.deck__slide.go .deck__tag{animation:rise .5s ease .12s both}
.deck__slide.go .deck__name{animation:wipe .6s cubic-bezier(.2,.7,.2,1) .2s both}
.deck__slide.go .deck__role{animation:rise .5s ease .34s both}
.deck__slide.go .deck__txt{animation:rise .5s ease .46s both}
.deck__slide.go .stat,.deck__slide.go .deck__list li{animation:rise .5s ease both;animation-delay:calc(.3s + var(--i) * 80ms)}
@keyframes cardIn{from{opacity:0;transform:perspective(900px) translateX(60px) rotateY(-18deg)}to{opacity:1;transform:none}}
@keyframes cardFlip{from{transform:perspective(900px) translateX(14px) rotateY(-10deg);filter:brightness(1.35)}to{transform:none;filter:none}}
@keyframes avaIn{from{opacity:0;transform:scale(.4) rotate(-14deg)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes wipe{from{opacity:0;clip-path:inset(0 100% 0 0);transform:translateX(-10px)}to{opacity:1;clip-path:inset(0 -4% 0 0);transform:none}}

/* Cadre étroit : la fiche passe au-dessus du robot, qui rapetisse */
.is-narrow .deck{top:12px;bottom:auto;left:16px;right:16px;width:auto;max-width:520px;margin-inline:auto;display:block}
.is-narrow .deck__card{padding:14px 16px 12px}
.is-narrow .deck__bar{margin-bottom:12px}
.is-narrow .deck__slide{min-height:132px;gap:8px 14px}
.is-narrow .ava{width:46px}
.is-narrow .ava--big{width:84px}
.is-narrow .deck__txt{font-size:.86rem;line-height:1.35}
.is-narrow .is-person .deck__txt{min-height:2.7em}
.is-narrow .deck__list{gap:6px;font-size:.86rem}
.is-narrow .stat{padding:9px 11px}
.is-narrow .deck__nav{margin-top:8px}
.is-narrow.is-deck .bubble{display:none}
.is-narrow.is-deck .hint,.is-narrow.is-deck .chips--play{display:none}

/* ---------- Commandes ---------- */
.dock{
  position:absolute;left:0;right:0;bottom:14px;z-index:4;
  display:flex;flex-direction:column;align-items:center;gap:10px;
  padding:0 16px;
}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:100%}
.chips--play .chip{font-size:.82rem;padding:.62em 1em}
.chip--go{border-color:var(--amber);box-shadow:0 0 18px rgba(255,154,31,.3)}
.is-narrow .dock{align-items:stretch}
.is-narrow .chips{
  flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;
  margin-inline:-16px;padding:5px 16px;max-width:none;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 16px,#000 calc(100% - 16px),transparent);
  mask-image:linear-gradient(90deg,transparent,#000 16px,#000 calc(100% - 16px),transparent);
}
.is-narrow .chips::-webkit-scrollbar{display:none}
.is-narrow .chip{flex:none}
.is-narrow .hint{align-self:center}
.chip{
  font:600 .92rem/1 var(--font-ui);
  padding:.74em 1.15em;
  color:var(--gold-light);
  background:rgba(28,16,8,.58);
  border:1px solid rgba(253,233,180,.28);
  border-radius:999px;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  cursor:pointer;
  transition:transform .3s cubic-bezier(.3,1.5,.5,1),background-color .25s,border-color .25s,box-shadow .25s,color .25s;
}
.chip:hover{transform:translateY(-2px);border-color:rgba(253,233,180,.75);background:rgba(66,40,16,.72)}
.chip:active{transform:scale(.95)}
.chip.is-active,.chip[aria-pressed="true"]{
  color:var(--ink);
  background:linear-gradient(160deg,#fff3cf,var(--amber));
  border-color:#fff3cf;
  box-shadow:0 0 24px rgba(255,154,31,.5);
}
.chip:focus-visible{outline:2px solid #ffd23a;outline-offset:3px}
.chip-quiet{background:transparent;border-color:transparent;color:rgba(253,233,180,.78);-webkit-backdrop-filter:none;backdrop-filter:none}
.chip-quiet:hover{background:rgba(66,40,16,.5);border-color:rgba(253,233,180,.4)}
.chip-home{position:absolute;top:14px;left:16px;z-index:4;font-size:.84rem;padding:.6em 1em;text-decoration:none}
/* Affichée dans la page du site : pas de lien retour, et le doigt peut faire défiler la page */
.embed .chip-home,.embed #btn-voice,.chip[hidden]{display:none}
.embed #robot{touch-action:pan-y}
.hint{
  margin:0;max-width:46ch;
  font-size:.86rem;line-height:1.35;text-align:center;text-wrap:balance;
  color:rgba(253,233,180,.74);
}

@media (prefers-reduced-motion: reduce){
  #mascot *{animation:none !important}
  .bubble,.chip,.deck{transition:none}
  .deck *,.deck *::before{animation:none !important}
}
</style>
</head>
<body>
<main class="stage" id="stage">
  <h1 class="sr-only">La mascotte ARRAKOR</h1>

  <canvas id="dust" aria-hidden="true"></canvas>

  <svg id="mascot" viewBox="0 -30 800 830" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="mascot-title">
    <title id="mascot-title">Robot mascotte en armure dorée, pouce levé, devant un halo ambré</title>
    <defs>
      <!-- Décor -->
      <radialGradient id="backlight" cx="400" cy="312" r="340" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#ffb04a" stop-opacity=".62"/>
        <stop offset=".55" stop-color="#ff8a1c" stop-opacity=".22"/>
        <stop offset="1" stop-color="#ff7a10" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="haloGrad" x1="138" y1="50" x2="662" y2="574" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#ffd98a"/>
        <stop offset=".5" stop-color="#ff9a1f"/>
        <stop offset="1" stop-color="#ffc45a"/>
      </linearGradient>
      <linearGradient id="ground" x1="0" y1="752" x2="0" y2="1100" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#4f2508"/>
        <stop offset=".16" stop-color="#2a1305"/>
        <stop offset="1" stop-color="#0d0b08"/>
      </linearGradient>
      <radialGradient id="groundGlow">
        <stop offset="0" stop-color="#ffa63a" stop-opacity=".6"/>
        <stop offset="1" stop-color="#ff8a1c" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="soft">
        <stop offset="0" stop-color="#000" stop-opacity=".55"/>
        <stop offset="1" stop-color="#000" stop-opacity="0"/>
      </radialGradient>
      <filter id="blurHalo" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="13"/>
      </filter>

      <!-- Armure -->
      <linearGradient id="gA" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#fff3cf"/><stop offset=".5" stop-color="#f4cb78"/><stop offset="1" stop-color="#dda244"/>
      </linearGradient>
      <linearGradient id="gB" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#f8d98f"/><stop offset=".55" stop-color="#dfa648"/><stop offset="1" stop-color="#b87c28"/>
      </linearGradient>
      <linearGradient id="gC" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#e0aa4c"/><stop offset=".6" stop-color="#b0741f"/><stop offset="1" stop-color="#855214"/>
      </linearGradient>
      <linearGradient id="dk" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#4c3826"/><stop offset=".6" stop-color="#2b1d13"/><stop offset="1" stop-color="#191009"/>
      </linearGradient>
      <linearGradient id="hand" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#8f7052"/><stop offset=".55" stop-color="#5e4632"/><stop offset="1" stop-color="#38281b"/>
      </linearGradient>
      <linearGradient id="split" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#fff0c4"/><stop offset=".5" stop-color="#f2c670"/>
        <stop offset=".5" stop-color="#d99c3e"/><stop offset="1" stop-color="#b47a28"/>
      </linearGradient>
      <radialGradient id="helm" cx=".34" cy=".24" r=".9">
        <stop offset="0" stop-color="#fff5d6"/><stop offset=".28" stop-color="#f7d58a"/>
        <stop offset=".62" stop-color="#e2ab4d"/><stop offset="1" stop-color="#a66b1d"/>
      </radialGradient>
      <radialGradient id="visor" cx="400" cy="300" r="170" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#34200f"/><stop offset=".6" stop-color="#1a0f08"/><stop offset="1" stop-color="#0b0603"/>
      </radialGradient>
      <linearGradient id="crest" x1="350" y1="0" x2="450" y2="0" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#fff6da"/><stop offset=".5" stop-color="#f6d083"/>
        <stop offset=".5" stop-color="#e0a646"/><stop offset="1" stop-color="#b47a28"/>
      </linearGradient>
      <linearGradient id="mask" x1="0" y1="312" x2="0" y2="386" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#fbe1a0"/><stop offset=".45" stop-color="#e4ad50"/><stop offset="1" stop-color="#a66c1f"/>
      </linearGradient>
      <linearGradient id="scarf" x1="280" y1="380" x2="560" y2="450" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#fbdc98"/><stop offset=".5" stop-color="#e6ae52"/><stop offset="1" stop-color="#bd8230"/>
      </linearGradient>
      <linearGradient id="capeGrad" x1="476" y1="410" x2="724" y2="624" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#b97a26"/><stop offset=".5" stop-color="#edb85e"/><stop offset="1" stop-color="#ffe6ad"/>
      </linearGradient>
      <linearGradient id="eyeGrad" x1="0" y1="-22" x2="0" y2="16" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#fffbd6"/><stop offset="1" stop-color="#ffc61a"/>
      </linearGradient>
      <linearGradient id="embGrad" x1="0" y1="456" x2="0" y2="502" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#fff7b8"/><stop offset="1" stop-color="#ffc21a"/>
      </linearGradient>
      <radialGradient id="eyeHalo">
        <stop offset="0" stop-color="#ffbe28" stop-opacity=".8"/>
        <stop offset=".5" stop-color="#ff9a1f" stop-opacity=".28"/>
        <stop offset="1" stop-color="#ff8a1c" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="blushG">
        <stop offset="0" stop-color="#ff6b45" stop-opacity=".9"/>
        <stop offset="1" stop-color="#ff6b45" stop-opacity="0"/>
      </radialGradient>
      <clipPath id="domeClip">
        <path d="M400,68 C300,68 214,140 210,240 C208,300 250,352 320,372 C350,381 380,384 400,384 C420,384 450,381 480,372 C550,352 592,300 590,240 C586,140 500,68 400,68 Z"/>
      </clipPath>
    </defs>

    <!-- Sol : dépasse largement du cadre pour remplir l'écran quel que soit son format -->
    <rect x="-4000" y="752" width="8800" height="4000" fill="url(#ground)"/>
    <ellipse cx="400" cy="754" rx="760" ry="30" fill="url(#groundGlow)"/>

    <!-- Halo -->

      y: anywhere ? rand(0, ground) : ground + rand(0, 30) * S,
      vy: -rand(9, 34), sway: rand(8, 22), f: rand(.5, 1.8), ph: rand(0, 6.28),
      size: rand(1.4, 4.2), life: anywhere ? rand(0, 6) : 0, max: rand(6, 14)
    };
  }
  function emitAt(kind, x, y, o) {                         /* position en pixels dans le cadre */
    if (calm) return;
    parts.push(Object.assign({ kind, x, y, vx: 0, vy: 0, g: 0, sway: 0, ph: rand(0, 6.28),
      size: 10, rot: 0, vr: 0, life: 0, max: 1 }, o));
  }
  const emit = (kind, xu, yu, o) => emitAt(kind, ux(xu), uy(yu), o);   /* position dans le repère du dessin */
  function burst(xu, yu, n, speed) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, Math.PI * 2), v = rand(.35, 1) * speed * S;
      emit('spark', xu, yu, { vx: Math.cos(a) * v, vy: Math.sin(a) * v - 120 * S, g: 300 * S, size: rand(1.6, 4.4), max: rand(.5, 1.1) });
    }
  }
  function haloBurst(n) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, Math.PI * 2), v = rand(50, 170) * S;
      emit('spark', 400 + 262 * Math.cos(a), 312 + 262 * Math.sin(a),
        { vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60 * S, g: 300 * S, size: rand(1.4, 3.4), max: rand(.6, 1.3) });
    }
    svg.classList.remove('flashing'); void svg.getBoundingClientRect(); svg.classList.add('flashing');
  }
  function ring(xu, yu, n) {
    for (let i = 0; i < n; i++) {
      const a = i / n * Math.PI * 2, v = rand(200, 260) * S;
      emit('spark', xu, yu, { vx: Math.cos(a) * v, vy: Math.sin(a) * v * .45, g: 0, size: rand(1.6, 3.6), max: rand(.5, .9) });
    }
  }
  const emitHeart = (xu, yu) => emit('heart', xu, yu, { vy: -rand(46, 84) * SS(), sway: rand(14, 30) * SS(), size: rand(9, 17) * SS(), rot: rand(-.35, .35), max: rand(1.5, 2.3) });
  const emitNote  = (xu, yu) => emit('note', xu, yu, { vx: rand(-20, 20) * SS(), vy: -rand(50, 80) * SS(), sway: rand(10, 24) * SS(), size: rand(10, 15) * SS(), rot: rand(-.3, .3), vr: rand(-.6, .6), max: rand(1.4, 2) });
  const emitStar  = (xu, yu) => emit('star', xu, yu, { size: 15 * SS(), vr: 2.4, max: .7 });
  const emitZ     = () => emit('z', 470 + rand(-6, 6), 150, { vx: 16 * SS(), vy: -26 * SS(), sway: 8 * SS(), size: 21 * SS(), max: 2.8 });

  /* ==========================================================================
     Cape : points d'appui + ondes qui se propagent vers la pointe
     ========================================================================== */
  const CAPE = [            /* x, y, souplesse (0 = fixé au cou, 1 = libre) */
    [476, 400, 0], [540, 404, .13], [606, 430, .4], [666, 468, .74], [716, 512, 1],
    [708, 548, 1], [718, 584, 1], [700, 620, .96],
    [654, 644, .74], [600, 630, .54], [546, 640, .34], [500, 606, .12], [482, 556, 0]
  ];
  const CAPE_CORE = [588, 528];
  const f1 = n => n.toFixed(1);
  const mix = (p, q, k) => [p[0] + (q[0] - p[0]) * k, p[1] + (q[1] - p[1]) * k];

  /* Courbe lisse passant par tous les points (Catmull-Rom converti en Bézier) */
  function curve(pts, start) {
    let d = start ? `M${f1(pts[0][0])},${f1(pts[0][1])}` : '';
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[Math.max(i - 1, 0)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(i + 2, pts.length - 1)];
      d += ` C${f1(p1[0] + (p2[0] - p0[0]) / 6)},${f1(p1[1] + (p2[1] - p0[1]) / 6)}`
         + ` ${f1(p2[0] - (p3[0] - p1[0]) / 6)},${f1(p2[1] - (p3[1] - p1[1]) / 6)}`
         + ` ${f1(p2[0])},${f1(p2[1])}`;
    }
    return d;
  }
  function drawCape(time, amp, lift) {
    const p = CAPE.map(([x, y, w]) => {
      const ph = (x - 476) / 52;
      return [
        x + w * (amp * 9 * Math.sin(time * 1.7 - ph) + lift * 12),
        y + w * (amp * 14 * Math.sin(time * 2.3 - ph * 1.25 + .8) - lift * 52)
      ];
    });
    /* trois bords lissés séparément pour garder deux coins nets */
    el.cape.setAttribute('d', curve(p.slice(0, 5), true) + curve(p.slice(4, 8)) + curve(p.slice(7)) + ' Z');
    const q = p.map(pt => mix(pt, CAPE_CORE, .12));
    el.band.setAttribute('d', curve(q.slice(3, 5), true) + curve(q.slice(4, 8)) + curve(q.slice(7, 10)));
    const a = mix(p[4], CAPE_CORE, .22), b = mix(p[7], CAPE_CORE, .2), c = mix(p[9], CAPE_CORE, .25);
    el.folds.setAttribute('d',
      `M494,420 Q${f1((494 + a[0]) / 2)},${f1((420 + a[1]) / 2 - 20)} ${f1(a[0])},${f1(a[1])}` +
      ` M498,470 Q${f1((498 + b[0]) / 2)},${f1((470 + b[1]) / 2 - 6)} ${f1(b[0])},${f1(b[1])}` +
      ` M494,526 Q${f1((494 + c[0]) / 2)},${f1((526 + c[1]) / 2 + 12)} ${f1(c[0])},${f1(c[1])}`);
  }

  /* ==========================================================================
     Poses
     ========================================================================== */
  function idlePose(T) {
    const b = Math.sin(t * 1.75);
    T.ry += -4 - 4 * b;                       /* flotte doucement */
    T.sq += .008 * b;
    T.hrot += 1.6 * Math.sin(t * .9);
    T.la1 += 2.5 * Math.sin(t * 2.6);
    T.la2 += 3.5 * Math.sin(t * 2.6 + .6);
    T.lw = 180 - T.la1 - T.la2;               /* le pouce reste bien vertical */
    T.ra1 += 1.2 * Math.sin(t * 1.75 + 1);
    T.emb += .25 * Math.sin(t * 2.2);
  }
  function sleepPose(T) {
    const b = calm ? 0 : Math.sin(t * 1.1);
    T.ry = 3; T.sq = .022 + .016 * b; T.rrot = 1.2; T.bodyRot = 2;
    T.hrot = 9 + 1.4 * b; T.hx = 4; T.hy = 9 + 2 * b; T.lookX = 0; T.lookY = 2;
    T.eyeL = T.eyeR = -.42; T.eyeS = .95; T.glow = .5; T.emb = .45;
    T.la1 = 10; T.la2 = 8; T.lw = 0; T.lopen = 1;
    T.ra1 = -12; T.ra2 = -6; T.rw = 0; T.ropen = 1;
    T.capeAmp = .35; T.halo = .3;
    if (t > nextZ) { nextZ = t + 1.25; emitZ(); }
  }
  function hop(T, x, t0, d, h) {
    if (calm) return;
    if (within(x, t0 - .16, t0)) T.sq += .075;                         /* élan */
    else if (within(x, t0, t0 + d)) {
      const u = (x - t0) / d;
      T.ry -= h * 4 * u * (1 - u);
      T.sq -= .035 * Math.sin(Math.PI * u);
      T.capeLift = Math.max(T.capeLift, .9 * Math.sin(Math.PI * u));
    } else if (within(x, t0 + d, t0 + d + .14)) T.sq += .06;           /* réception */
  }
  function waveArm(T, x) {
    T.ra1 = -98; T.ra2 = -52 + 17 * Math.sin(x * 10);
    T.rw = 20 * Math.sin(x * 10 + .7); T.ropen = 1;
  }
  function armsOut(T, a1, a2) {
    T.la1 = a1; T.la2 = a2; T.lw = 0; T.lopen = 1;
    T.ra1 = -a1; T.ra2 = -a2; T.rw = 0; T.ropen = 1;
  }

  /* ==========================================================================
     Présentations par étapes : chaque étape dure le temps de sa phrase (voix
     comprise), puis laisse la place à la suivante.
     ========================================================================== */
  function scripted(steps, leave) {
    return {
      dur: Infinity, still: 0, cues: [], steps,
      pose(T, x, a) {
        if (a.i === undefined) { a.i = -1; a.s0 = t; a.min = 0; a.heard = -9; }
        if (voiceBusy()) a.heard = t;
        const over = t - a.s0 >= a.min && !voiceBusy() && t - a.heard >= .45;
        if (a.i < 0 || a.goto !== undefined || over) {
          const next = a.goto !== undefined ? a.goto : a.i + 1;
          a.goto = undefined;
          if (next >= steps.length) { a.done = true; return; }
          const st = steps[next];
          a.i = next; a.s0 = t; a.heard = -9; a.cue = 0;
          a.min = st.say ? st.say.length / CPS + (hasVoice() ? .9 : 1.9) : st.dur;
          a.est = st.say ? Math.max(a.min, st.say.length / 14 + .8) : st.dur;
          if (st.enter) st.enter(a);
          if (st.say) say(st.say, Infinity); else hideBubble();
        }
        steps[a.i].pose(T, calm ? .5 : t - a.s0, a);
      },
      leave() { hideBubble(); stopVoice(); if (leave) leave(); }
    };
  }

  function buildPresent() {
    return scripted([
      { say: PRESENTATION[0],                   /* 1. salue de la main */
        pose(T, x) { hop(T, x, .1, .42, 24); waveArm(T, x); T.hrot += 5; T.eyeS = 1.08; T.rrot += 1.5 * Math.sin(x * 5); } },
      { say: PRESENTATION[1],                   /* 2. poing sur le cœur, petite révérence */
        pose(T, x) {
          T.ra1 = -63; T.ra2 = 158; T.rw = 0; T.ropen = 0;
          T.bodyRot = 3; T.hrot -= 5; T.hy += 3;
          T.emb = 1.9 + .4 * Math.sin(x * 6);
        } },
      { say: PRESENTATION[2],                   /* 3. bras ouverts vers le halo */
        pose(T, x) {
          armsOut(T, 118, 22);
          T.ry -= 6; T.hrot += 3 * Math.sin(x * 3);
          T.halo = 1.8; T.haloS = 1.035; T.capeAmp = 1.7; T.eyeS = 1.08;
        } },
      { dur: 1.3,                               /* 4. pouce levé et clin d'œil */
        enter() { burst(226, 330, 44, 330); haloBurst(26); sfx.chime(); },
        pose(T, x) { hop(T, x, .1, .42, 30); T.eyeS = 1.12; T.halo = 1.5; if (within(x, .5, .95)) T.eyeR = .06; } }
    ]);
  }

  /* ---------- L'équipage : une fiche par membre, façon diaporama ---------- */
  function fitDeck() {                         /* où le robot se range pendant la présentation */
    const feet = OY + 772 * S;
    if (narrow) {                              /* fiche au-dessus : le robot descend dans la place que libère la barre d'actions */
      const floor = Math.max(feet, H - dock.offsetHeight - 34);
      const room = floor - (dk.root.offsetTop + dk.root.offsetHeight) - 10;
      view.kT = clamp(room / (756 * S), .3, .9); view.dxT = 0; view.dyT = deckOpen ? floor - feet : 0;
    } else {                                   /* fiche à droite : le robot se décale et garde la place de sa bulle au-dessus de lui */
      view.kT = clamp((feet - 150) / (764 * S), .6, .86); view.dxT = -W * .22; view.dyT = 0;
    }
  }
  function showSlide(fiches, i, a) {
    const f = fiches[i], person = f.k !== undefined;
    deckOpen = true;
    stage.classList.add('is-deck');
    if (dk.bars.length !== fiches.length) {    /* une barre de progression par fiche */
      dk.bar.textContent = '';
      dk.bars = fiches.map(() => dk.bar.appendChild(document.createElement('i')));
      dk.bar.classList.toggle('is-long', fiches.length > 10);
    }
    dk.slide.classList.remove('go'); dk.card.classList.remove('flip');
    dk.slide.classList.toggle('is-group', !!f.crew);
    dk.slide.classList.toggle('is-person', person);
    dk.tag.textContent = f.tag;
    dk.name.textContent = f.titre;
    dk.role.textContent = f.sous || ''; dk.role.hidden = !f.sous;
    dk.txt.textContent = f.txt || ''; dk.txt.hidden = !f.txt;
    if (person) dk.ava.style.setProperty('--k', f.k);

    dk.stats.textContent = ''; dk.stats.hidden = !f.stats;
    (f.stats || []).forEach((pair, n) => {
      const box = document.createElement('div'), b = document.createElement('b'), label = document.createElement('span');
      box.className = 'stat'; box.style.setProperty('--i', n);
      b.textContent = pair[0]; label.textContent = pair[1];
      box.append(b, label); dk.stats.appendChild(box);
    });

    dk.list.textContent = ''; dk.list.hidden = !f.liste;
    dk.list.classList.toggle('is-tags', !!f.puces);
    (f.liste || []).forEach((line, n) => {
      const li = document.createElement('li'), b = document.createElement('b'), txt = document.createElement('span');
      const at = f.puces ? -1 : line.indexOf(' : ');
      li.style.setProperty('--i', n);
      b.textContent = f.num ? n + 1 : '';
      if (at > 0) {                             /* « Précision : … » : le mot-clé ressort */
        const key = document.createElement('strong');
        key.textContent = line.slice(0, at);
        txt.append(key, line.slice(at));
      } else txt.textContent = line;
      li.append(b, txt); dk.list.appendChild(li);
    });

    dk.count.textContent = (i + 1) + ' / ' + fiches.length;
    dk.bars.forEach((b, k) => b.style.setProperty('--p', k < i ? 1 : 0));
    a.bar = dk.bars[i];
    a.sparkled = !person;
    void dk.slide.offsetWidth;                 /* relance les animations d'arrivée */
    dk.slide.classList.add('go');
    if (i > 0) dk.card.classList.add('flip');
    fitDeck();
    sfx.pop();
  }
  function closeDeck() { deckOpen = false; stage.classList.remove('is-deck'); }
  function deckGo(dir) {
    if (!act || !act.def.deck) return;
    unlock();
    act.goto = clamp(act.i + dir, 0, act.def.steps.length);
  }
  function sparkleAround(node) {               /* une couronne d'étincelles autour du portrait */
    const r = node.getBoundingClientRect(), s = stage.getBoundingClientRect();
    const cx = r.left - s.left + r.width / 2, cy = r.top - s.top + r.height / 2, rad = node.offsetWidth / 2 + 8;
    for (let i = 0; i < 18; i++) {
      const g = i / 18 * Math.PI * 2, v = rand(30, 90);
      emitAt('spark', cx + Math.cos(g) * rad, cy + Math.sin(g) * rad,
        { vx: Math.cos(g) * v, vy: Math.sin(g) * v, size: rand(1.4, 3.2), max: rand(.5, .95) });
    }
  }
  function buildDeck(fiches) {
    const point = (T, x, a) => {               /* la mascotte montre la fiche */
      T.deck = 1;
      hop(T, x, .05, .36, 14);
      if (narrow) { T.ra1 = -150; T.ra2 = -12; T.lookY -= 4; T.hy -= 2; }
      else { T.ra1 = -96 + 4 * Math.sin(x * 2.4); T.ra2 = -8; T.lookX += 5; T.hrot += 3; }
      T.rw = 0; T.ropen = 1;
      if (!a.sparkled && x > .32) { a.sparkled = true; sparkleAround(dk.ava); }
    };
    const finale = (T, x) => {                 /* dernière fiche : pouce levé et clin d'œil */
      T.deck = 1; hop(T, x, .1, .42, 26); T.eyeS = 1.12; T.halo = 1.6;
      if (within(x, 1, 1.4)) T.eyeR = .06;
    };
    const def = scripted(fiches.map((f, i) => ({
      say: f.dit,
      enter(a) { showSlide(fiches, i, a); if (f.fin) { burst(226, 330, 40, 320); haloBurst(24); sfx.chime(); } },
      pose: f.fin ? finale : point
    })), closeDeck);
    def.deck = true;
    return def;
  }

  const ACTIONS = {
    present: buildPresent(),
    ...Object.fromEntries(Object.keys(SUJETS).map(n => [n, buildDeck(SUJETS[n])])),

    cheer: {
      dur: 1.55, still: .5,
      cues: [[.2, () => { burst(226, 330, 46, 330); haloBurst(28); sfx.chime(); say(pick(BRAVOS), 1.1); }]],
      pose(T, x) {
        hop(T, x, .1, .5, 40);
        const e = bell(x, .1, 1.15);
        T.la1 = 85 - 16 * e * Math.sin(x * 15);
        T.la2 = 55 + 10 * e * Math.sin(x * 15 + .5);
        T.lw = 180 - T.la1 - T.la2; T.lopen = 0;
        T.eyeS = 1 + .14 * e; T.halo = 1 + 1.1 * e; T.haloS = 1 + .03 * e; T.emb = 1 + e;
        T.hrot += 5 * e;
        if (within(x, .62, 1)) T.eyeR = .06;
      }
    },

    wave: {
      dur: 2.6, still: 1,
      cues: [[.15, () => say('Coucou !', 1.5)]],
      pose(T, x) {
        hop(T, x, .1, .42, 22);
        if (x < 2.25) {
          waveArm(T, x);
          T.hrot += 5; T.eyeS = 1.08; T.rrot += 1.5 * Math.sin(x * 5);
        }
      }
    },

    hearts: {
      dur: 4.7, still: 2,
      cues: [[.3, () => say('Plein de cœurs pour vous !', 2.2)]],
      pose(T, x) {
        const e = smooth(x / .3) * smooth((4.35 - x) / .3);
        if (x < 4.35) {
          T.heart = 1; T.arc = 0; T.blush = 1;
          armsOut(T, 58, 118);                 /* mains sous les joues */
          T.lw = 8; T.rw = -8;
        }
        T.eyeS = 1 + e * (.1 + .08 * Math.sin(x * 9));
        T.rrot += 3 * e * Math.sin(x * 4);
        T.ry -= 6 * e * Math.abs(Math.sin(x * 4));
        T.hrot += 4 * e * Math.sin(x * 4 + .6);
        T.emb = 1 + .8 * e; T.halo = 1 + .4 * e;
        if (x > .35 && x < 4.1 && t > nextHeart) { nextHeart = t + .15; emitHeart(rand(290, 510), rand(170, 300)); }
      }
    },

    dance: {
      dur: 6.7, still: 1.25,
      cues: [[.1, () => say('En piste !', 1.2)], [6.2, () => { burst(226, 330, 40, 320); haloBurst(24); sfx.chime(); }]],
      pose(T, x) {
        if (x > 6.05) { hop(T, x, 6.1, .42, 30); T.eyeS = 1.12; return; }
        const e = smooth(x / .4) * smooth((6.05 - x) / .3);
        const b = x / .5, s = Math.sin(Math.PI * b), a = Math.sin(2 * Math.PI * b);
        const beat = Math.pow(Math.abs(Math.cos(Math.PI * b)), 6);
        T.rx += 26 * s * e;
        T.ry -= 16 * Math.abs(s) * e;
        T.rrot += 5 * s * e; T.hrot -= 7 * s * e; T.bodyRot = 2 * s * e;
        T.la1 = 100 + 26 * a; T.la2 = 62 - 18 * a; T.lw = 180 - T.la1 - T.la2; T.lopen = 0;
        T.ra1 = -100 + 26 * a; T.ra2 = -62 - 18 * a; T.rw = 0; T.ropen = 0;
        T.legL = 10 * Math.max(0, s) * e; T.legR = -10 * Math.max(0, -s) * e;
        T.capeAmp = 1.9; T.eyeS = 1.06;
        T.halo = 1 + .8 * beat; T.haloS = 1 + .025 * beat; T.emb = 1 + .9 * beat;
        if (t > nextNote) { nextNote = t + .5; emitNote(rand(250, 550), rand(150, 260)); }
      }
    },

    spin: {
      dur: 1.8, still: .5,
      cues: [[.28, () => say('Youpi !', 1)], [.64, () => ring(400, 440, 36)]],
      pose(T, x) {
        if (calm) { armsOut(T, 96, 6); return; }
        if (x < .24) T.sq += .09;
        else if (x < 1.08) {
          const u = (x - .24) / .84;
          T.ry -= 54 * 4 * u * (1 - u);
          T.sq -= .04 * Math.sin(Math.PI * u);
          spin = Math.PI * 2 * smooth(u);
          T.capeLift = Math.sin(Math.PI * u); T.capeAmp = 2;
        } else {
          spin = 0;
          if (x < 1.24) T.sq += .07;
        }
        if (x > .18 && x < 1.15) { armsOut(T, 96, 6); T.eyeS = 1.12; }
        T.halo = 1 + bell(x, .2, 1.3);
      }
    },

    yawn: {                                    /* bâille, puis s'endort */
      dur: 2.3, still: 2.2,
      cues: [[.2, () => say('Bonne nuit…', 1.3)]],
      pose(T, x) {
        const e = bell(x, 0, 2), c = smooth((x - .5) / 1.2);
        T.la1 = 60; T.la2 = 135; T.lw = 0; T.lopen = 1;          /* main devant le masque */
        T.ra1 = -125; T.ra2 = -20; T.rw = 0; T.ropen = 1;        /* étirement */
        T.hrot -= 6 * e; T.hy -= 3 * e; T.sq -= .02 * e;
        T.eyeL = T.eyeR = 1 - 1.42 * c;
        T.glow = 1 - .5 * c; T.halo = 1 - .7 * c;
      },
      onEnd() { asleep = true; nextZ = t + .4; }
    },

    wake: {
      dur: 1.9, still: .4,
      cues: [[.12, () => say('Hein ? Je ne dormais pas !', 1.5)]],
      pose(T, x) {
        hop(T, x, .08, .4, 30);
        if (x < .9) { T.round = 1; T.arc = 0; T.eyeS = 1.15; armsOut(T, 110, 40); }
        T.blush = bell(x, .6, 1.9);
      }
    },

    /* Petits gestes spontanés quand personne ne touche à rien */
    wink: {
      dur: 1, still: .3,
      cues: [[.2, () => emitStar(474, 272)]],
      pose(T, x) {
        const e = bell(x, 0, 1);
        if (within(x, .15, .6)) T.eyeR = .06;
        T.hrot += 6 * e; T.eyeS = 1 + .06 * e;
      }
    },
    tilt: {
      dur: 1.9, still: .9, cues: [],
      pose(T, x, a) { const e = bell(x, 0, 1.9); T.hrot += 9 * e * a.dir; T.lookX += 5 * e * a.dir; }
    },
    boing: {
      dur: .9, still: .1, cues: [],
      pose(T, x) { hop(T, x, .16, .4, 16); }
    }
  };

  /* ==========================================================================
     Enchaînement des actions
     ========================================================================== */
  function syncButtons() {
    const name = act && !act.auto ? act.name : null;
    chips.forEach(c => {
      if (c === btnSleep) return;
      c.classList.toggle('is-active', c.dataset.act === name);
      const rail = c.parentNode;
      if (c.dataset.act !== name || rail.scrollWidth <= rail.clientWidth + 1) return;
      const left = rail.scrollLeft + c.getBoundingClientRect().left - rail.getBoundingClientRect().left - (rail.clientWidth - c.offsetWidth) / 2;
      rail.scrollTo({ left, behavior: calm ? 'auto' : 'smooth' });
    });
    const sleepy = asleep || name === 'yawn';
    btnSleep.setAttribute('aria-pressed', String(sleepy));
    btnSleep.textContent = sleepy ? 'Réveiller' : 'Dodo';
  }

  function play(name, auto) {
    if (!auto) { if (paused) setPaused(false); unlock(); }
    if (act && act.def.leave) act.def.leave();             /* referme proprement ce qui était en cours */
    if (name === 'sleep') name = (asleep || (act && act.name === 'yawn')) ? 'wake' : 'yawn';
    if (asleep) {                              /* toute action réveille d'abord le robot */
      queue.length = 0;
      if (name !== 'wake') queue.push(name);
      name = 'wake';
      asleep = false;
    }
    spin = 0;
    act = { name, def: ACTIONS[name], t0: t, cue: 0, auto: !!auto, dir: Math.random() < .5 ? -1 : 1 };
    syncButtons();
    start();
  }
  function finish() {
    const def = act.def;
    act = null; spin = 0;
    if (def.leave) def.leave();
    if (def.onEnd) def.onEnd();
    nextIdle = t + rand(6, 10);
    if (queue.length) play(queue.shift());
    else syncButtons();
  }

  /* ==========================================================================
     Boucle
     ========================================================================== */
  function update(dt) {
    t += dt;
    const T = tgt;
    for (const k of KEYS) T[k] = DEF[k];
    if (!calm) idlePose(T);

    /* regard : suit le pointeur, sinon balaie doucement les environs */
    const now = performance.now();
    let lx = ptr.tx, ly = ptr.ty;
    if (now - ptr.lastMove > 3500) { lx = Math.sin(t * .5) * .5; ly = Math.sin(t * .33 + 1) * .3; }
    if (asleep || calm) { lx = 0; ly = 0; }
    const k = Math.min(1, dt * 5);
    px += (lx - px) * k; py += (ly - py) * k;
    T.hx += px * 8; T.hy += py * 4; T.hrot += px * 2.5;
    T.lookX += px * 6; T.lookY += py * 3.5;

    /* clignement */
    if (!calm && t > nextBlink) { blinkEnd = t + .12; nextBlink = t + (Math.random() < .2 ? .32 : rand(2.4, 5.6)); }
    if (t < blinkEnd) { T.eyeL = .06; T.eyeR = .06; }

    if (asleep) sleepPose(T);

    if (act) {
      const x = t - act.t0, def = act.def;
      def.pose(T, calm ? def.still : x, act);
      while (act.cue < def.cues.length && def.cues[act.cue][0] <= x) def.cues[act.cue++][1]();
      if (act.bar) act.bar.style.setProperty('--p', R(clamp((t - act.s0) / act.est, 0, 1)));
      if (x >= def.dur || act.done) finish();
    }

    /* quand il parle, le robot hoche la tête et son emblème palpite */
    if (!calm && !asleep && (voiceBusy() || (speech.on && speech.shown < speech.text.length))) {
      const w = Math.sin(t * 14);
      T.hy += 1.3 * w; T.emb += .5 + .4 * w; T.eyeS += .025 * w;
    }

    /* caresse sur le casque */
    const rubbing = ptr.onHead && now - ptr.lastRub < 160;
    pet = clamp(pet + (rubbing ? 2.2 : -.9) * dt, 0, 1);
    if (pet > .02) {
      if (asleep) T.blush = Math.max(T.blush, .7 * pet);
      else if (!act || act.auto) {
        T.blush = Math.max(T.blush, pet);
        T.eyeS += .08 * pet;
        T.eyeL = Math.min(T.eyeL, 1 - .3 * pet); T.eyeR = Math.min(T.eyeR, 1 - .3 * pet);
        T.hrot += 5 * pet * ptr.headX; T.hy += 3 * pet;
        if (pet > .75 && t > nextPetHeart) { nextPetHeart = t + .45; emitHeart(rand(320, 480), rand(120, 200)); }
        if (pet > .8 && now - petSaid > 8000) { petSaid = now; say('Hihi, ça chatouille !', 1.4); }
      }
    }

    /* un petit geste spontané de temps en temps */
    if (!act && !asleep && !calm && pet < .1 && t > nextIdle) play(pick(['wink', 'tilt', 'boing']), true);

    if (calm) snap(); else integrate(dt);

    if (!calm) {
      for (const e of embers) {
        e.life += dt;
        e.y += e.vy * S * dt;
        e.x += Math.sin(t * e.f + e.ph) * e.sway * S * dt;
        if (e.life > e.max || e.y < -30) Object.assign(e, newEmber(false));
      }
    }
    for (const p of parts) {
      p.life += dt;
      p.vy += p.g * dt;
      p.x += (p.vx + Math.sin(t * 3 + p.ph) * p.sway) * dt;
      p.y += p.vy * dt;
      p.rot += p.vr * dt;
    }
    parts = parts.filter(p => p.life < p.max);
    updateSpeech();
  }

  function apply() {
    const c = cur;
    const d = clamp(c.deck, 0, 1.05);
    view.k = 1 + (view.kT - 1) * d; view.dx = view.dxT * d; view.dy = view.dyT * d;
    svg.style.transform = d > .002 ? `translate(${R(view.dx)}px,${R(view.dy)}px) scale(${view.k.toFixed(4)})` : '';
    const turn = Math.cos(spin);
    const flip = (turn < 0 ? -1 : 1) * Math.max(Math.abs(turn), .14);
    el.root.setAttribute('transform',
      `translate(${R(c.rx)} ${R(c.ry)}) rotate(${R(c.rrot)} 400 772) translate(400 772) ` +
      `scale(${R((1 + c.sq * .6) * flip)} ${R(1 - c.sq)}) translate(-400 -772)`);
    const lift = clamp(1 + c.ry / 170, .55, 1.1);
    el.shadow.setAttribute('transform', `translate(${R(400 + c.rx)} 772) scale(${R(lift * Math.abs(flip) * .6 + lift * .4)} ${R(lift)}) translate(-400 -772)`);
    el.shadow.setAttribute('opacity', R(clamp(.25 + .75 * lift, 0, 1)));
    el.upper.setAttribute('transform', `rotate(${R(c.bodyRot)} 400 600)`);
    el.head.setAttribute('transform', `translate(${R(c.hx)} ${R(c.hy)}) rotate(${R(c.hrot)} 400 388)`);
    el.eyes.setAttribute('transform', `translate(${R(c.lookX)} ${R(c.lookY)})`);
    el.eyeL.setAttribute('transform', `translate(338 288) scale(${R(c.eyeS)} ${R(c.eyeS * c.eyeL)})`);
    el.eyeR.setAttribute('transform', `translate(462 288) scale(${R(c.eyeS)} ${R(c.eyeS * c.eyeR)})`);
    const arc = R(clamp(c.arc, 0, 1)), heart = R(clamp(c.heart, 0, 1)), round = R(clamp(c.round, 0, 1));
    el.arcs.forEach(e => e.setAttribute('opacity', arc));
    el.hearts.forEach(e => e.setAttribute('opacity', heart));
    el.rounds.forEach(e => e.setAttribute('opacity', round));
    const shine = calm ? 1 : .88 + .12 * Math.sin(t * 2.6);
    el.eyeHalos.forEach(e => e.setAttribute('opacity', R(clamp(c.glow * shine, 0, 1.4))));
    el.crestGlow.setAttribute('opacity', R(clamp(c.glow * shine, 0, 1)));
    el.blush.setAttribute('opacity', R(clamp(c.blush, 0, 1)));
    el.embGlow.setAttribute('opacity', R(clamp(.45 * c.emb, 0, 1)));
    el.embGlow.setAttribute('transform', `translate(400 482) scale(${R(.8 + .2 * c.emb)}) translate(-400 -482)`);

    el.armL.setAttribute('transform', `translate(318 448) rotate(${R(c.la1)})`);
    el.foreL.setAttribute('transform', `translate(0 50) rotate(${R(c.la2)})`);
    el.handL.setAttribute('transform', `translate(0 64) rotate(${R(180 + c.lw)})`);
    el.armR.setAttribute('transform', `translate(482 448) rotate(${R(c.ra1)})`);
    el.foreR.setAttribute('transform', `translate(0 50) rotate(${R(c.ra2)})`);
    el.handR.setAttribute('transform', `translate(0 64) rotate(${R(180 + c.rw)})`);
    const lo = clamp(c.lopen, 0, 1), ro = clamp(c.ropen, 0, 1);
    el.fistL.setAttribute('opacity', R(1 - lo)); el.openL.setAttribute('opacity', R(lo));
    el.fistR.setAttribute('opacity', R(1 - ro)); el.openR.setAttribute('opacity', R(ro));
    el.legL.setAttribute('transform', `rotate(${R(c.legL)} 352 598)`);
    el.legR.setAttribute('transform', `rotate(${R(c.legR)} 448 598)`);

    el.halo.setAttribute('transform',
      `translate(${R(-px * 10)} ${R(-py * 6)}) translate(400 312) scale(${R(c.haloS)}) translate(-400 -312)`);
    const breath = calm ? 0 : .12 * Math.sin(t * 1.7);
    el.haloGlow.setAttribute('opacity', R(clamp(.3 + .38 * c.halo + breath, .1, 1)));
    el.capeBack.setAttribute('transform', `rotate(${R(calm ? 0 : 2.5 * Math.sin(t * 1.4) + 6 * c.capeLift)} 312 428)`);
    drawCape(calm ? 0 : t, c.capeAmp, c.capeLift);
  }

  function render() {
    apply();

    /* poussière lointaine */
    dctx.clearRect(0, 0, W, H);
    const m = Math.max(W, H);
    for (const c of clouds) {
      const size = c.r * m * 2;
      const x = (((c.x + c.v * t) % 1.4) + 1.4) % 1.4 - .2;
      const y = c.y + Math.sin(t * .12 + c.ph) * .03;
      dctx.globalAlpha = c.a * (.75 + .25 * Math.sin(t * .3 + c.ph));
      dctx.drawImage(blob, x * W - size / 2, y * H - size * .3, size, size * .6);
    }
    dctx.globalAlpha = 1;

    /* brume au sol, braises et étincelles au premier plan */
    ectx.clearRect(0, 0, W, H);
    ectx.globalCompositeOperation = 'lighter';
    const gy = uy(756);
    for (const w of wisps) {
      const ww = w.w * Math.max(W, 800 * S), hh = w.h * S, span = W + ww;
      const x = (((w.x * span + w.v * S * t) % span) + span) % span - ww;
      ectx.globalAlpha = w.a * (.7 + .3 * Math.sin(t * .5 + w.ph));
      ectx.drawImage(blob, x, gy - hh * .5 + w.o * S, ww, hh);
    }
    for (const e of embers) {
      const a = Math.sin(Math.PI * Math.min(1, e.life / e.max)) * (.55 + .45 * Math.sin(t * 5 * e.f + e.ph));
      if (a <= 0) continue;
      const r = e.size * SS() * 2.4;
      ectx.globalAlpha = Math.min(1, a);
      ectx.drawImage(spark, e.x - r, e.y - r, r * 2, r * 2);
    }
    for (const p of parts) {
      if (p.kind !== 'spark') continue;
      const a = 1 - p.life / p.max, r = p.size * SS() * 2.6 * (.5 + .5 * a);
      ectx.globalAlpha = a;
      ectx.drawImage(spark, p.x - r, p.y - r, r * 2, r * 2);
    }
    ectx.globalCompositeOperation = 'source-over';

    /* cœurs, notes, étoiles et « z » */
    for (const p of parts) {
      if (p.kind === 'spark') continue;
      const u = p.life / p.max;
      const a = smooth(u / .15) * smooth((1 - u) / .4);
      ectx.globalAlpha = a;
      ectx.save();
      ectx.translate(p.x, p.y);
      ectx.rotate(p.rot);
      if (p.kind === 'z') {
        const sz = p.size * (1 + 1.1 * u);
        ectx.font = `600 ${sz.toFixed(1)}px Inter, system-ui, sans-serif`;
        ectx.fillStyle = '#ffe7a8';
        ectx.shadowColor = 'rgba(255,150,40,.9)'; ectx.shadowBlur = 8;
        ectx.fillText('z', 0, 0);
      } else {
        const grow = p.kind === 'star' ? Math.sin(Math.PI * u) * 1.6 : .7 + .5 * smooth(u / .25);
        const r = p.size * grow * 1.6;
        ectx.drawImage(SPRITE[p.kind], -r, -r, r * 2, r * 2);
      }
      ectx.restore();
    }
    ectx.globalAlpha = 1;
  }

  function frame(now) {
    if (!running) return;
    const dt = Math.min(.05, (now - last) / 1000);
    last = now;
    update(dt);
    render();
    if (!visible) { running = false; return; }                     /* hors écran : on ne calcule rien */
    if (calm && !act && !speech.on) { running = false; return; }   /* mouvements réduits : rien ne tourne au repos */
    requestAnimationFrame(frame);
  }
  function start() {
    if (running || paused || !visible) return;
    running = true;
    last = performance.now();
    requestAnimationFrame(frame);
  }
  function setPaused(value) {
    paused = value;
    stage.classList.toggle('paused', paused);
    btnPause.setAttribute('aria-pressed', String(paused));
    btnPause.textContent = paused ? 'Reprendre' : 'Pause';
    if (paused) { running = false; stopVoice(); } else start();
  }

  /* ---------- Mise en page ---------- */
  function layout() {
    const dockH = dock.offsetHeight + 26;
    stage.style.setProperty('--dock', dockH + 'px');
    const sr = stage.getBoundingClientRect();
    W = sr.width; H = sr.height;
    const hs = Math.max(1, H - dockH);                     /* hauteur de la zone du dessin */
    S = Math.min(W / 800, hs / 830);
    OX = (W - 800 * S) / 2;
    OY = (hs - 830 * S) / 2 + 30 * S;
    narrow = W < 820;
    stage.classList.toggle('is-narrow', narrow);
    svg.style.transformOrigin = `${R(OX + 400 * S)}px ${R(OY + 772 * S)}px`;
    fitDeck();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    for (const c of [dust, embersC]) {
      c.width = Math.max(1, Math.round(W * dpr));
      c.height = Math.max(1, Math.round(H * dpr));
    }
    dctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ectx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const count = Math.round(Math.min(130, Math.max(36, W * H / 9000)));
    embers = Array.from({ length: count }, () => newEmber(true));
    if (speech.on) placeBubble();
    render();
  }

  /* ---------- Événements ---------- */
  robot.addEventListener('click', () => play('cheer'));
  chips.forEach(c => c.addEventListener('click', () => play(c.dataset.act)));
  btnPause.addEventListener('click', () => setPaused(!paused));
  btnSound.addEventListener('click', () => { setSound(!sound.on); unlock(); });
  btnVoice.addEventListener('click', nextVoice);
  $('deck-prev').addEventListener('click', () => deckGo(-1));
  $('deck-next').addEventListener('click', () => deckGo(1));
  $('deck-close').addEventListener('click', () => { if (act && act.def.deck) act.done = true; });

  window.addEventListener('keydown', e => {
    if (deckOpen && e.key === 'Escape') { if (act) act.done = true; return; }
    if (deckOpen && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) { e.preventDefault(); deckGo(e.key === 'ArrowRight' ? 1 : -1); return; }
    if (e.key === 'v' || e.key === 'V') { nextVoice(); return; }      /* V : essayer la voix suivante */
    if (e.target instanceof HTMLButtonElement) return;
    if (e.code === 'Space') { e.preventDefault(); play('cheer'); }
    const n = Number(e.key);
    if (n >= 1 && n <= chips.length) play(chips[n - 1].dataset.act);
  });

  stage.addEventListener('pointermove', e => {
    const r = stage.getBoundingClientRect();
    const x = e.clientX - r.left, y = e.clientY - r.top, now = performance.now();
    ptr.tx = clamp((x / r.width - .5) * 2, -1, 1);
    ptr.ty = clamp((y / r.height - .42) * 2, -1, 1);
    const xu = 400 + (x - OX - 400 * S - view.dx) / (S * view.k), yu = 772 + (y - OY - 772 * S - view.dy) / (S * view.k);
    const dx = (xu - 400) / 205, dy = (yu - 226) / 178;
    ptr.onHead = dx * dx + dy * dy < 1;
    ptr.headX = clamp((xu - 400) / 190, -1, 1);
    if (ptr.onHead) ptr.lastRub = now;
    ptr.lastMove = now;
  });
  stage.addEventListener('pointerleave', () => { ptr.lastMove = -1e9; ptr.onHead = false; });

  reduce.addEventListener('change', () => { calm = reduce.matches; start(); });
  new ResizeObserver(layout).observe(stage);
  new ResizeObserver(layout).observe(dock);
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(es => { visible = es[es.length - 1].isIntersecting; if (visible) start(); else stopVoice(); }).observe(stage);
  }

  document.addEventListener('visibilitychange', () => { if (document.hidden) stopVoice(); });
  /* La page du site peut demander la visite guidée (bouton « Suivre la visite guidée » de l'accueil) */
  window.addEventListener('message', e => {
    const web = /^https?:/.test(location.origin);           /* ouvert depuis un fichier, l'origine vaut « null » */
    if (e.data !== 'arrakor:visite' || e.origin !== (web ? location.origin : 'null')) return;
    if (e.source) e.source.postMessage('arrakor:ok', web ? e.origin : '*');
    if (!act || act.name !== 'tour') play('tour');
  });

  setSound(sound.on);
  layout();
  start();
})();
</script>
</body>
</html>
